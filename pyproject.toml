[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "ASYNC", # nástrahy asyncio (blokující volání apod.)
    "S",     # bandit — bezpečnostní kontroly
    "DTZ",   # datetime bez časové zóny
    "PIE",
    "RET",
    "TRY",
]
ignore = [
    "TRY003",  # delší zprávy ve výjimkách jsou tu záměr (jdou uživateli do UI)
    "TRY400",  # logger.error je v pořádku i bez exc_info
    "TRY301",  # raise uvnitř try je tu čitelnější než rozdělování bloků
    # Texty obsahují záměrně české znaky a en dash „–“, protože přesně tak je
    # uvádí zdrojový web a uživatelé je vidí ve stavech entit.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert je v testech smysl existence
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
